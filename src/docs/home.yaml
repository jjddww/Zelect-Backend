paths:

  /api/home/banner:

    get:

      tags:
        - Home

      summary: 홈 배너 조회

      description: 홈 화면 상단 배너 목록 조회 API


      responses:

        "200":

          description: 배너 조회 성공


          content:

            application/json:

              schema:

                type: object


                properties:

                  success:

                    type: boolean

                    example: true


                  data:

                    type: array


                    items:

                      type: object


                      properties:

                        id:

                          type: integer

                          example: 1


                        title:

                          type: string

                          example: "Summer Collection"


                        imageUrl:

                          type: string

                          example: "https://cdn.zelect.com/banner.png"